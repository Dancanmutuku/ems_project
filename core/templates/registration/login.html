{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --brand: #12355b;
            --brand-dark: #0b2545;
            --surface: #ffffff;
            --page: #eef2f6;
            --border: #d8dee8;
            --text: #18212f;
            --muted: #637083;
        }

        body {
            background: var(--page);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            padding: 1rem;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 18px 45px rgba(18, 53, 91, 0.12);
        }

        .login-card h3 {
            color: var(--brand);
            font-weight: 700;
        }

        .form-label {
            color: var(--text);
            font-weight: 600;
        }

        .form-control {
            border-color: var(--border);
            border-radius: 6px;
            padding: 0.7rem 0.85rem;
        }

        .form-control:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 0.2rem rgba(18, 53, 91, 0.14);
        }

        .btn-primary {
            background-color: var(--brand);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            padding: 0.72rem 1rem;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--brand-dark);
            box-shadow: 0 8px 18px rgba(18, 53, 91, 0.18);
        }

        @media (max-width: 480px) {
            .login-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4">Employee Login</h3>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger text-center small">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" novalidate>
        {% csrf_token %}
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" name="username" id="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-2">Login</button>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
