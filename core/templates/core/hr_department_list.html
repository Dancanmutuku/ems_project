{% extends "base_hr.html" %}

{% block content %}
<style>
    .departments-card {
        border: 1px solid #d8dee8;
        border-radius: 8px;
        overflow: hidden;
    }

    .departments-header {
        background-color: #12355b;
        color: #fff;
        padding: 1rem 1.5rem;
        border-radius: 8px 8px 0 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .departments-header h4 {
        margin: 0;
        font-weight: 600;
    }

    .btn-add {
        background-color: #2f6f5e;
        border: none;
        border-radius: 6px;
        color: #fff;
        font-weight: 500;
        transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-add:hover {
        background-color: #245548;
        color: #fff;
        box-shadow: 0 8px 18px rgba(31, 122, 77, 0.16);
    }

    .table-modern {
        border-radius: 0.8rem;
        overflow: hidden;
    }

    .table-modern th {
        background-color: #0b2545 !important;
        color: #fff;
        font-weight: 600;
        vertical-align: middle;
    }

    .table-modern td {
        vertical-align: middle;
    }

    .btn-warning, .btn-danger {
        border: none;
        border-radius: 6px;
        padding: 0.3rem 0.9rem;
        font-weight: 500;
        transition: background-color 0.2s ease, color 0.2s ease;
    }

    .btn-warning:hover {
        background-color: #b7791f;
        color: #fff;
    }

    .btn-danger:hover {
        background-color: #a33a3a;
        color: #fff;
    }

    @media (max-width: 767px) {
        .departments-header {
            flex-direction: column;
            gap: 0.8rem;
            text-align: center;
        }
        .btn-add {
            width: 100%;
        }
    }
</style>

<div class="container my-5">
    <div class="card departments-card shadow-sm">
        <div class="departments-header">
            <h4>Departments</h4>
            <a href="{% url 'hr_department_create' %}" class="btn btn-add">Add Department</a>
        </div>

        <div class="card-body p-0">
            {% if departments %}
            <div class="table-responsive">
                <table class="table table-modern table-striped table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Description</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for dept in departments %}
                        <tr>
                            <td>{{ dept.name }}</td>
                            <td>{{ dept.description|default:"-" }}</td>
                            <td class="text-center">
                                <a href="{% url 'hr_department_edit' dept.pk %}" class="btn btn-sm btn-warning me-1">Edit</a>
                                <a href="{% url 'hr_department_delete' dept.pk %}" class="btn btn-sm btn-danger">Delete</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <div class="p-4 text-center">
                <div class="alert alert-info mb-0">No departments found.</div>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
