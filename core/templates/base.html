<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Techpak Technologies Limited{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --brand: #12355b;
      --brand-dark: #0b2545;
      --brand-mid: #2d4f73;
      --success: #2f6f5e;
      --warning: #b7791f;
      --danger: #a33a3a;
      --info: #4f718b;
      --neutral: #5f6b7a;
      --page: #f3f6fa;
      --surface: #ffffff;
      --border: #d8dee8;
      --text: #18212f;
      --muted: #637083;
    }

    body {
      background-color: var(--page);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      padding-top: 70px;
    }

    /* Footer styling */
    footer {
      background-color: var(--surface);
      padding: 15px 10px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }
    footer a {
      color: var(--brand);
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }

    /* Navbar link button styling */
    .nav-link-button, .nav-link {
      color: #fff !important;
      text-decoration: none;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-size: 1rem;
    }
    .nav-link-button:hover, .nav-link:hover {
      color: #ccc !important;
      text-decoration: underline;
    }

    .card {
      border-color: var(--border) !important;
      border-radius: 8px !important;
      box-shadow: 0 8px 24px rgba(18, 53, 91, 0.06);
    }

    .card-header {
      border-bottom-color: var(--border);
      font-weight: 600;
    }

    .bg-primary,
    .bg-info,
    .bg-success,
    .bg-warning {
      background-color: var(--brand) !important;
      color: #fff !important;
    }

    .bg-secondary {
      background-color: var(--neutral) !important;
      color: #fff !important;
    }

    .bg-danger {
      background-color: var(--danger) !important;
      color: #fff !important;
    }

    .text-primary,
    .text-info {
      color: var(--brand) !important;
    }

    .text-success {
      color: var(--success) !important;
    }

    .text-warning {
      color: var(--warning) !important;
    }

    .text-danger {
      color: var(--danger) !important;
    }

    .btn {
      border-radius: 6px;
      font-weight: 500;
    }

    .btn-primary,
    .btn-info,
    .btn-success,
    .btn-dark {
      background-color: var(--brand) !important;
      border-color: var(--brand) !important;
      color: #fff !important;
    }

    .btn-primary:hover,
    .btn-info:hover,
    .btn-success:hover,
    .btn-dark:hover {
      background-color: var(--brand-dark) !important;
      border-color: var(--brand-dark) !important;
    }

    .btn-secondary {
      background-color: var(--neutral) !important;
      border-color: var(--neutral) !important;
      color: #fff !important;
    }

    .btn-warning {
      background-color: var(--warning) !important;
      border-color: var(--warning) !important;
      color: #fff !important;
    }

    .btn-danger {
      background-color: var(--danger) !important;
      border-color: var(--danger) !important;
      color: #fff !important;
    }

    .btn-outline-primary,
    .btn-outline-info,
    .btn-outline-success {
      color: var(--brand) !important;
      border-color: var(--brand) !important;
    }

    .btn-outline-primary:hover,
    .btn-outline-info:hover,
    .btn-outline-success:hover {
      background-color: var(--brand) !important;
      color: #fff !important;
    }

    .btn-outline-secondary {
      color: var(--neutral) !important;
      border-color: var(--neutral) !important;
    }

    .btn-outline-danger {
      color: var(--danger) !important;
      border-color: var(--danger) !important;
    }

    .badge {
      border-radius: 6px;
      font-weight: 600;
    }

    .badge.bg-success {
      background-color: var(--success) !important;
    }

    .badge.bg-warning {
      background-color: #f2e8d2 !important;
      color: #6f4a12 !important;
      border: 1px solid #e0c184;
    }

    .badge.bg-danger {
      background-color: #f1dddd !important;
      color: #842c2c !important;
      border: 1px solid #d7a4a4;
    }

    .badge.bg-primary,
    .badge.bg-info {
      background-color: var(--brand-mid) !important;
    }

    .badge.bg-secondary {
      background-color: #edf0f3 !important;
      color: var(--neutral) !important;
      border: 1px solid var(--border);
    }

    .table-light th,
    .table thead th {
      background-color: #eef2f6 !important;
      color: var(--text);
      border-color: var(--border);
    }

    .table-responsive {
      -webkit-overflow-scrolling: touch;
    }

    .card-header,
    .list-group-item {
      overflow-wrap: anywhere;
    }

    @media (max-width: 575.98px) {
      body {
        padding-top: 62px;
      }

      main.container {
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .navbar-brand {
        max-width: calc(100vw - 5rem);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .card-body {
        padding: 1rem;
      }

      .btn-group,
      .btn-group-sm {
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .btn-group > .btn,
      .btn-group-sm > .btn {
        border-radius: 6px !important;
      }
    }

  </style>
</head>
<body>

<!-- Navbar: fixed-top -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: var(--brand-dark);">
  <div class="container">
    <a class="navbar-brand" href="{% url 'employee_dashboard' %}">Techpak Technologies Limited</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" 
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
        {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'employee_dashboard' %}">Dashboard</a>
          </li>

          <!-- My Profile link -->
          <li class="nav-item">
            <a class="nav-link" href="{% url 'employee_profile' %}">My Profile</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{% url 'employee_kpi_list' %}">Performance</a>
          </li>

          <li class="nav-item ms-2">
            <form action="{% url 'logout' %}" method="post" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="nav-link-button">Logout</button>
            </form>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'login' %}">Login</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<!-- Main content -->
<main class="container my-4">
  {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="mt-auto">
  &copy; {{ now|date:"Y" }} All Rights Reserved | 
  <a href="https://x.com/dan_bnp" target="_blank">Dancan Mutuku</a>
</footer>

<!-- Bootstrap JS (for navbar toggle) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
